services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres # base de arranque
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # crea bases al iniciar

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloakdb
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      - db

  api:
    build: .
    depends_on:
      - db
      - keycloak
    ports:
      - "3005:3000"
    environment:
      DATABASE_URL: postgres://postgres:admin@db:5432/apidb
      PORT: 3000
      JWT_SECRET: Ambulancia
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./keycloak.json:/app/keycloak.json
      - node_modules:/app/node_modules
      - ./swagger.yaml:/app/swagger.yaml
    command: sh -c "npx prisma migrate deploy && npm run dev"

volumes:
  db_data:
  node_modules:
